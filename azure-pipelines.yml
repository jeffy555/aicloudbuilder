trigger:
  branches:
    include:
      - main

pr: none

variables:
  # Create a Library variable group in Azure DevOps (example: spiritops-variable-group)
  # and store secrets there: DATABASE_URL, JWT_SECRET, OPENAI_API_KEY,
  # BITWARDEN_ACCESS_TOKEN, BITWARDEN_PROJECT_ID
  - group: spiritops-variable-group

  # Pipeline/runtime settings
  - name: azureServiceConnection
    value: "SPNBuild"
  - name: AZURE_LOCATION
    value: "southindia"
  - name: runDbMigrations
    value: "true"

  # Container registry settings
  - name: acrName
    value: "spiritops"
  - name: acrLoginServer
    value: "spiritops.azurecr.io"
  - name: imageRepository
    value: "spiritops-app"

  # Azure Container Apps settings
  - name: resourceGroup
    value: "AICloudBuilder"
  - name: containerAppEnvironment
    value: "spiritops-container-app-env"
  - name: containerAppName
    value: "spiritops-app"
  - name: containerPort
    value: "9005"

  # Build settings
  - name: dockerfilePath
    value: "Dockerfile"
  - name: imageTag
    value: "$(Build.BuildId)"

stages:
  - stage: Build
    displayName: Build and Push Image
    jobs:
      - job: BuildAndPush
        displayName: Build and Push to ACR
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build and push Docker image
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"
                echo "Building image: ${IMAGE}"

                az acr login --name "$(acrName)"
                docker build -f "$(dockerfilePath)" -t "${IMAGE}" .
                docker push "${IMAGE}"

                echo "##vso[task.setvariable variable=fullImageName;isOutput=true]${IMAGE}"
            name: buildStep

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployToACA
        displayName: Deploy Container App
        pool:
          vmImage: ubuntu-latest
        variables:
          builtImage: $[ stageDependencies.Build.BuildAndPush.outputs['buildStep.fullImageName'] ]
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js 20 for migrations
            condition: and(succeeded(), eq(variables['runDbMigrations'], 'true'))
            inputs:
              versionSpec: "20.x"

          - script: |
              set -euo pipefail
              : "${DATABASE_URL:?DATABASE_URL is required for db migration}"
              echo "Installing dependencies for migration..."
              npm ci
              echo "Running drizzle-kit push..."
              npx drizzle-kit push
            displayName: Run database migration (pipeline-only)
            condition: and(succeeded(), eq(variables['runDbMigrations'], 'true'))
            env:
              DATABASE_URL: $(DATABASE_URL)

          - task: AzureCLI@2
            displayName: Create/Update Azure Container App
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Mandatory production configuration checks
                : "${AZURE_LOCATION:?AZURE_LOCATION is required}"
                : "${DATABASE_URL:?DATABASE_URL is required (PostgreSQL connection string)}"
                : "${JWT_SECRET:?JWT_SECRET is required}"
                : "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
                : "${BITWARDEN_ACCESS_TOKEN:?BITWARDEN_ACCESS_TOKEN is required}"
                : "${BITWARDEN_PROJECT_ID:?BITWARDEN_PROJECT_ID is required}"

                IMAGE="$(builtImage)"
                echo "Deploying image: ${IMAGE}"

                az extension add --name containerapp --upgrade --only-show-errors

                # Ensure resource group and environment exist (safe idempotent checks)
                if ! az group show --name "$(resourceGroup)" >/dev/null 2>&1; then
                  az group create --name "$(resourceGroup)" --location "$(AZURE_LOCATION)"
                fi

                if ! az containerapp env show --name "$(containerAppEnvironment)" --resource-group "$(resourceGroup)" >/dev/null 2>&1; then
                  az containerapp env create \
                    --name "$(containerAppEnvironment)" \
                    --resource-group "$(resourceGroup)" \
                    --location "$(AZURE_LOCATION)"
                fi

                ACR_USERNAME="$(az acr credential show -n "$(acrName)" --query username -o tsv)"
                ACR_PASSWORD="$(az acr credential show -n "$(acrName)" --query "passwords[0].value" -o tsv)"

                if az containerapp show --name "$(containerAppName)" --resource-group "$(resourceGroup)" >/dev/null 2>&1; then
                  echo "Container App exists - updating."
                  az containerapp secret set \
                    --name "$(containerAppName)" \
                    --resource-group "$(resourceGroup)" \
                    --secrets \
                      database-url="$(DATABASE_URL)" \
                      jwt-secret="$(JWT_SECRET)" \
                      openai-api-key="$(OPENAI_API_KEY)" \
                      bitwarden-access-token="$(BITWARDEN_ACCESS_TOKEN)" \
                      bitwarden-project-id="$(BITWARDEN_PROJECT_ID)"

                  az containerapp update \
                    --name "$(containerAppName)" \
                    --resource-group "$(resourceGroup)" \
                    --image "${IMAGE}" \
                    --set-env-vars \
                      NODE_ENV=production \
                      PORT="$(containerPort)" \
                      DATABASE_URL=secretref:database-url \
                      JWT_SECRET=secretref:jwt-secret \
                      OPENAI_API_KEY=secretref:openai-api-key \
                      BITWARDEN_ACCESS_TOKEN=secretref:bitwarden-access-token \
                      BITWARDEN_PROJECT_ID=secretref:bitwarden-project-id

                  az containerapp registry set \
                    --name "$(containerAppName)" \
                    --resource-group "$(resourceGroup)" \
                    --server "$(acrLoginServer)" \
                    --username "${ACR_USERNAME}" \
                    --password "${ACR_PASSWORD}"
                else
                  echo "Container App does not exist - creating."
                  az containerapp create \
                    --name "$(containerAppName)" \
                    --resource-group "$(resourceGroup)" \
                    --environment "$(containerAppEnvironment)" \
                    --ingress external \
                    --target-port "$(containerPort)" \
                    --min-replicas 1 \
                    --max-replicas 3 \
                    --image "${IMAGE}" \
                    --registry-server "$(acrLoginServer)" \
                    --registry-username "${ACR_USERNAME}" \
                    --registry-password "${ACR_PASSWORD}" \
                    --env-vars \
                      NODE_ENV=production \
                      PORT="$(containerPort)" \
                      DATABASE_URL=secretref:database-url \
                      JWT_SECRET=secretref:jwt-secret \
                      OPENAI_API_KEY=secretref:openai-api-key \
                      BITWARDEN_ACCESS_TOKEN=secretref:bitwarden-access-token \
                      BITWARDEN_PROJECT_ID=secretref:bitwarden-project-id \
                    --secrets \
                      database-url="$(DATABASE_URL)" \
                      jwt-secret="$(JWT_SECRET)" \
                      openai-api-key="$(OPENAI_API_KEY)" \
                      bitwarden-access-token="$(BITWARDEN_ACCESS_TOKEN)" \
                      bitwarden-project-id="$(BITWARDEN_PROJECT_ID)"
                fi

                FQDN="$(az containerapp show --name "$(containerAppName)" --resource-group "$(resourceGroup)" --query properties.configuration.ingress.fqdn -o tsv)"
                echo "Container App FQDN: ${FQDN}"
            env:
              DATABASE_URL: $(DATABASE_URL)
              JWT_SECRET: $(JWT_SECRET)
              OPENAI_API_KEY: $(OPENAI_API_KEY)
              BITWARDEN_ACCESS_TOKEN: $(BITWARDEN_ACCESS_TOKEN)
              BITWARDEN_PROJECT_ID: $(BITWARDEN_PROJECT_ID)
