check_id: CKV_AZURE_67
check_name: Ensure that 'HTTP Version' is the latest, if used to run the Function app
resource_types:
  - azurerm_function_app
  - azurerm_linux_function_app
  - azurerm_windows_function_app
terraform_attribute: site_config.http2_enabled
attribute_type: nested_block
required_value: true
description: Enables HTTP/2 for function app (latest HTTP version)

remediation_snippet: |
  site_config {
    http2_enabled = true
  }

complete_example: |
  resource "azurerm_function_app" "example" {
    name                       = "example-function"
    location                   = azurerm_resource_group.example.location
    resource_group_name        = azurerm_resource_group.example.name
    app_service_plan_id        = azurerm_app_service_plan.example.id
    storage_account_name       = azurerm_storage_account.example.name
    storage_account_access_key = azurerm_storage_account.example.primary_access_key
    
    site_config {
      http2_enabled = true
    }
  }

tags:
  - function-app
  - http
  - security
  - azure
  - protocol

keywords:
  - http version
  - http2
  - http/2
  - latest http
  - protocol version

confidence_factors:
  exact_match: true
  tested: true
  documentation_url: https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/function_app#site_config

